  <g stroke="#bdcec4" fill="none"><rect x="1" y="1" width="758" height="391"/><path d="M205 1v391M1 46h758M1 94h758M1 142h758M1 190h758M1 238h758M1 286h758M1 334h758"/></g>
  <g font-family="Arial,sans-serif" fill="#173630" font-size="15">
    <g font-weight="bold"><text x="18" y="29">Funcionalidad</text><text x="224" y="29">Resultado para el usuario</text></g>
    <text x="18" y="76">Servicios</text><text x="224" y="76">Agrupa luz, agua, internet y otros gastos recurrentes.</text>
    <text x="18" y="124">Recibos mensuales</text><text x="224" y="124">Conserva el monto y la fecha; evita duplicados del mes.</text>
    <text x="18" y="172">Resumen</text><text x="224" y="172">Muestra cuánto falta pagar y qué parte está pagada.</text>
    <text x="18" y="220">Calendario</text><text x="224" y="220">Ubica vencimientos y consulta los recibos de cada día.</text>
    <text x="18" y="268">Historial y análisis</text><text x="224" y="268">Compara el recibo con los tres anteriores del servicio.</text>
    <text x="18" y="316">Respaldos</text><text x="224" y="316">Descarga y restaura sus datos desde un archivo JSON.</text>
    <text x="18" y="367">Instalación y avisos</text><text x="224" y="357">Permite instalar la web app y usarla sin conexión.</text><text x="224" y="378">Los avisos se revisan solo mientras la app está activa.</text>
